# Claude Code Hook Configuration
# Each hook type can be enabled/disabled and configured independently
#
# ALL OFF since 19 Oct 2026 (Gavin: "I don't want to delete it or lose it, but ...
# I don't want to keep it turned on"). Every hook below has enabled: false; each
# handler checks that first (should_handle in lib/handlers/*.py), so nothing plays
# or speaks. hook_runner.py is still registered in .claude/settings.json and still
# starts on each event, then does nothing. To turn one back on, set its top-level
# enabled: true; the sound and voice settings under it are kept as they were.

global:
  # OFF as of 2026-08-03. When true, the Stop handler copies the ENTIRE live
  # transcript to Temp/transcript_dump.jsonl and the raw hook payload to
  # Temp/hook_raw_input.json on every turn, unredacted. It captured a pasted API
  # key within seconds of it arriving. Turn on only for a single debugging run:
  #   HOOK_DEBUG=1 <command>
  # The audio/voice notifications below are UNAFFECTED by this flag.
  debug: false
  debug_dir: "Temp"
  project_dir: ""

hooks:
  stop:
    enabled: false
    sound:
      enabled: true
      file: ".claude/sounds/ui_open_1.mp3"
      volume: 0.2
      delay_ms: 200
    voice:
      enabled: true
      name: "Victoria"
      volume: 0.2
      rate: 480
    summary:
      mode: "sentences"
      max_sentences: 1
      max_characters: 40
      start: "action"

  ask_user_question:
    enabled: false
    sound:
      enabled: true
      file: ".claude/sounds/bell_ring_1.mp3"
      volume: 0.6
      delay_ms: 200
    voice:
      enabled: true
      name: "Victoria"
      volume: 0.3
      rate: 480
    message_mode: "extract"
    default_message: "Claude has a question for you"

  permission_request:
    enabled: false
    sound:
      enabled: true
      file: ".claude/sounds/bell_call.mp3"
      volume: 0.4
      delay_ms: 200
    voice:
      enabled: true
      name: "Victoria"
      volume: 0.3
      rate: 480
    message_template: "Approve {tool_name}?"

  notification:
    enabled: false
    sound:
      enabled: true
      file: ".claude/sounds/bell_ring_1.mp3"
      volume: 0.2
      delay_ms: 200
    voice:
      enabled: true
      name: "Victoria"
      volume: 0.2
      rate: 350
    idle_message: "Claude is idle"
    auth_message: "Auth successful"
    default_message: "Notification"

  subagent_start:
    enabled: false
    sound:
      enabled: true
      file: ".claude/sounds/coin_simple.mp3"
      volume: 0.2
      delay_ms: 200
    voice:
      enabled: true
      name: "Victoria"
      volume: 0.2
      rate: 480
    message_template: "Subagent {agent_type} started"

  subagent_stop:
    enabled: false
    sound:
      enabled: true
      file: ".claude/sounds/marimba_complete.mp3"
      volume: 0.2
      delay_ms: 200
    voice:
      enabled: true
      name: "Victoria"
      volume: 0.2
      rate: 480
    message_template: "Subagent {agent_type} finished"

  teammate_idle:
    enabled: false
    sound:
      enabled: true
      file: ".claude/sounds/marimba_nudge_1.mp3"
      volume: 0.5
      delay_ms: 200
    voice:
      enabled: true
      name: "Victoria"
      volume: 0.3
      rate: 480
    message_template: "{teammate_name} is idle"

  task_completed:
    enabled: false
    sound:
      enabled: true
      file: ".claude/sounds/harp_finish.mp3"
      volume: 0.5
      delay_ms: 200
    voice:
      enabled: true
      name: "Victoria"
      volume: 0.3
      rate: 480
    message_template: "Task completed: {task_subject}"
    max_subject_length: 80

  post_tool_use_failure:
    enabled: false
    sound:
      enabled: true
      file: ".claude/sounds/error_buzz.mp3"
      volume: 0.2
      delay_ms: 200
    voice:
      enabled: true
      name: "Victoria"
      volume: 0.2
      rate: 480
    message_template: "{tool_name} failed"

  user_prompt_submit:
    enabled: false
    sound:
      enabled: false
      file: ""
      volume: 0.2
      delay_ms: 200
    voice:
      enabled: false
      name: "Victoria"
      volume: 0.2
      rate: 480

  pre_compact:
    enabled: false
    sound:
      enabled: true
      file: ".claude/sounds/blink.mp3"
      volume: 0.2
      delay_ms: 200
    voice:
      enabled: true
      name: "Victoria"
      volume: 0.2
      rate: 480
    message: "Compacting context"
