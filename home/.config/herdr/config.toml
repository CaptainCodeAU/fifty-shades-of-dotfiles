onboarding = false
[update]
version_check = false
manifest_check = false
channel = "stable"

# =============================================================================
#  Keybindings - ported from home/.tmux.conf
# =============================================================================
# tmux is no longer launched (2026-07-29) but its config is kept on disk as a
# retreat path. These bindings carry the muscle memory across.
#
# ONE BINDING PER ACTION. tmux allowed several keys for the same command
# (splits were bound four ways: | Right % h). herdr takes a single string per
# action, so each of those collapsed to the one that was actually used.
#
# Everything NOT listed here already matched tmux by default and is therefore
# left alone: new_tab prefix+c, switch_tab prefix+1..9, zoom prefix+z,
# close_pane prefix+x, copy_mode prefix+[, focus_pane_* prefix+h/j/k/l,
# split_horizontal prefix+minus. Copy mode is already vi-style (v selects,
# y copies, q/Esc leaves), matching the mode-keys vi setup in .tmux.conf.

[keys]
# Prefix: ctrl+Space, as in tmux (`unbind C-b; set -g prefix C-Space`).
# Side benefit: it frees ctrl+b, which herdr otherwise consumes as the prefix,
# for its normal copy-mode page-up.
prefix = "ctrl+space"

# Splits. tmux bound the right-hand split to | Right % and h; | was the one in
# use ("Option 1: Pipe and Dash (most popular)"). The bottom split keeps minus,
# which is already herdr's default, so both halves of the pair survive intact.
# Note herdr's naming is the opposite of tmux's flag: split_vertical makes the
# vertical divider, i.e. a pane on the RIGHT, same as tmux `split-window -h`.
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"

# Detach. tmux used prefix+d; herdr ships prefix+q.
detach = "prefix+d"

# Config reload on prefix+r, as in tmux (`bind r source-file ...`). herdr ships
# r as resize_mode and shift+r as reload; those are swapped here because there
# is no tmux resize muscle memory to preserve (tmux-tilit owned Alt+Arrow for
# resizing and .tmux.conf reclaimed those keys for pane switching instead).
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"

# Tab switching without the prefix, matching tmux's `bind -n S-Left/S-Right`.
# This replaces herdr's prefix+p / prefix+n rather than adding to it.
previous_tab = "shift+left"
next_tab = "shift+right"

# Agent switching without the prefix -- the vertical companion to the tab keys
# above, so the whole arrow cluster moves you around: left/right across tabs,
# up/down across agents.
#
# These ADD capability rather than replacing anything. herdr ships both actions
# as "optional, unset by default", so there was no agent-switch key at all
# before this; moving between agents meant moving between the panes and tabs
# they happened to live in.
#
# Scope is the whole session, not the current workspace: the agent list spans
# workspaces, so these walk every agent pane there is. With agent_panel_sort =
# "priority" set under [ui] below, they walk it in the sidebar's own order --
# i.e. next/previous by which agent wants attention, not by position.
#
# Direct chords, no prefix, exactly like the tab keys. Nothing in herdr's
# defaults binds shift+up or shift+down (navigate mode uses BARE up/down for
# navigate_workspace_*, which is a different, mode-local binding), so there is
# no collision to resolve.
previous_agent = "shift+up"
next_agent = "shift+down"

# --- Deliberately NOT ported ---
# Alt+Arrow pane switching (`bind -n M-Left/M-Right/...`): herdr accepts
#   alt+left etc, but focus_pane_* takes ONE key, so binding the arrows would
#   remove prefix+h/j/k/l. The vim keys won on grounds of matching the tmux
#   j/k/l bindings that were already there. To swap, replace the four
#   focus_pane_* defaults with alt+left / alt+down / alt+up / alt+right.
# prefix+b break-pane: no herdr equivalent. b stays toggle_sidebar.
# prefix+h split-right: a .tmux.conf accident (line 77 silently overrode the
#   select-pane -L on line 31). herdr keeps h as focus-pane-left, which is what
#   the tmux config originally intended.
# M-H / M-L tab switching: superseded by shift+left / shift+right above.
# ctrl+v rectangle select in copy mode: no herdr equivalent.
# shift+Enter: .tmux.conf had to reclaim it from tmux-tilit so Claude Code
#   received newlines. herdr binds nothing to it, so no reclaim is needed.

# =============================================================================
#  Speak-selection replacement
# =============================================================================
# macOS "Speak selection" (Accessibility > Spoken Content) asks the FOCUSED APP
# for its selected text over the accessibility API. Inside herdr there is
# nothing to ask for: herdr captures the mouse, so a drag makes herdr's OWN
# selection and the host terminal never has one. The accessibility hotkey is
# still enabled system-wide -- it simply finds an empty selection and stays
# quiet. Same root cause as cmd+C appearing to do nothing.
#
# The bridge is the clipboard. [ui] copy_on_select is true by default, so a
# drag has ALREADY copied by the time you let go; these bindings just speak
# what is there. Copy mode works identically: prefix+[ then v, y, then speak.
#
# FUNCTION KEYS, not ctrl+alt+letter. The first attempt used ctrl+alt+s and was
# silent: 3 of the 5 iTerm2 profiles here set "Option Key Sends" to Normal, so
# option composes a character instead of acting as a modifier and the chord
# never reaches herdr as a chord. Upstream warns exactly this -- "Alt, Cmd/Super
# ... depend on your terminal" -- and names function keys among the most
# reliable direct bindings. f9/f10 sidestep the whole question.
#
# `sh -c` is explicit so the pipeline inside the script is never at the mercy of
# how herdr execs a command string, and "$HOME" is expanded by the shell rather
# than hardcoded, so this config stays portable across machines.
#
# The script does the work: it strips ANSI escapes, box drawing, Nerd Font
# glyphs and rule lines before speaking. That filtering is the whole reason to
# route through the clipboard -- the native accessibility hotkey reads the raw
# screen and will happily pronounce the pane borders and prompt decoration.

# cmd+alt+backtick, matching the system-wide Spoken Content hotkey, so there is
# one gesture to remember whether or not the text is inside herdr. Both start
# and stop on the same key, which is how the system one behaves too.
#
# CAVEAT, and it is a real one: macOS registers that combination GLOBALLY, and a
# system hotkey is consumed before any application sees it. Evidence it is live:
# com.apple.speech.voice.prefs records LastClientIDFromSpeakingHotkey pointing
# at iTerm2, so it has fired here. If herdr never receives the key, the system
# owns it -- change or disable the Spoken Content shortcut in System Settings >
# Accessibility > Spoken Content to hand it over, or use prefix+a below.
#
# prefix+a is bound to the same thing and cannot be intercepted by anything,
# which is the point of keeping it.

[[keys.command]]
key = "cmd+alt+backtick"
type = "shell"
command = "sh -c 'exec \"$HOME/.local/bin/speak-clipboard\" --toggle'"

[[keys.command]]
key = "prefix+a"
type = "shell"
command = "sh -c 'exec \"$HOME/.local/bin/speak-clipboard\" --toggle'"

[ui.toast]
delivery = "system"

[experimental]
switch_ascii_input_source_in_prefix = true
pane_history = true

[ui]
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true

# Hold ctrl and right-click-DRAG to send the gesture straight to the app in
# the pane instead of opening herdr's own pane menu. Per herdr's changelog
# (#148) this only forwards hold/drag; a plain tap/click still opens herdr's
# menu regardless of modifier -- for that, use the menu's own "Send
# right-clicks to pane" (or `herdr pane input --right-click pane`), a
# separate per-pane toggle added in 0.8.2. The link-handler plugin's
# ctrl+click trigger only fires on the LEFT button (docs/HERDR_PLUGINS.md),
# so ctrl+right-click here is a distinct, non-clashing gesture.
right_click_passthrough_modifier = "ctrl"

# Which host (mini vs MacBook) and workspace the outer terminal title shows.
# Renders on the herdr server, so {hostname} is always the machine the panes
# actually run on, even when attached via `herdr --remote`.
window_title = "{hostname}: {workspace}"

# Status entry at the right edge of herdr's own (inner) tab bar: live GPU
# reading for the mlbox-ubuntu 3090 box, over SSH. Shows "PC off" when it's
# asleep/unreachable. Points at the repo path directly (same reason as the
# plugin below: herdr's own runtime dir only ever gets config.toml stowed
# into it, per home/.config/herdr/.gitignore) -- Mac-specific for now, since
# the SSH access this depends on only exists from this Mac. Resolves $HOME
# at runtime via the password database instead of a literal path, both
# because herdr's daemon has no $HOME set (see gpu-status.sh) and so this
# tracked file never has to hold a real username.
tab_bar_right = [
  { type = "command", command = "HOME=\"$(eval echo ~$(id -un))\"; \"$HOME/CODE/Scaffoldings/fifty-shades-of-dotfiles/home/.config/herdr/gpu-status.sh\"", interval_seconds = 5, timeout_seconds = 4 },
]
tab_bar_right_separator = " · "

[theme]
name = "terminal"
auto_switch = false

# Navigate-mode cursor row color in the sidebar, kept separate from the
# active Space/Agent row highlight (theme.custom.active_row_bg, unset here).
[theme.custom]
selection_bg = "#313244"
