id = "dotfiles.window-title-fix"
name = "Window Title"
version = "0.3.0"
min_herdr_version = "0.8.2"
description = "Keeps the outer terminal title accurate: shows live project/branch/agent-status when an agent is focused, and falls back to the focused pane's real folder name otherwise -- works around herdr#3200 without ever renaming a workspace"
platforms = ["macos", "linux"]

[[events]]
on = "workspace.created"
command = ["./update-title.sh"]

[[events]]
on = "pane.agent_status_changed"
command = ["./update-title.sh"]

[[events]]
on = "pane.agent_detected"
command = ["./update-title.sh"]

[[events]]
on = "pane.focused"
command = ["./update-title.sh"]

[[actions]]
id = "toggle-host"
title = "Toggle hostname in window title"
contexts = ["global"]
command = ["./toggle-host.sh"]
