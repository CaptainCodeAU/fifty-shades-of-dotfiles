id = "dotfiles.speak-selection"
name = "Speak Selection"
version = "0.1.0"
min_herdr_version = "0.9.1"
description = "Speaks a Claude Code pane's mouse highlight by borrowing the clipboard (snapshot, Ctrl+Shift+C, read, restore), or the clipboard itself in any other pane; a press while speaking stops it. Bound to ctrl+alt+backtick and prefix+backtick in config.toml."
platforms = ["macos"]

[[actions]]
id = "speak"
title = "Speak the highlight (Claude pane) or the clipboard; stop if speaking"
contexts = ["global"]
command = ["./speak.sh"]
