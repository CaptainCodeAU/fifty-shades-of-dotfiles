# pnpm global configuration (pnpm 12)
# ------------------------------------------------------------------------------
# Stow-managed; symlinked to:
#   Linux/WSL: ~/.config/pnpm/config.yaml         (pnpm's native XDG path)
#   macOS:     ~/Library/Preferences/pnpm/config.yaml -> ~/.config/pnpm/config.yaml
#              (the macOS bridge symlink is created by install.sh)
#
# Format: YAML, camelCase keys. Kebab-case keys are silently ignored here.
# pnpm 12 no longer reads the sibling `rc` file; auth lives in `auth.ini`.
#
# SOME KEYS ARE SILENTLY IGNORED IN THIS FILE (measured 2026-10-06 on 12.3.4,
# 12.6.0 and 12.9.0; pnpm 11 warned, pnpm 12 says nothing): blockExoticSubdeps,
# supportedArchitectures, python, cargo. A key pnpm ignores here reads back as
# `undefined` from `pnpm config get`; `pnpm-config-check` fails on any such key,
# so run it after adding one. Ruling D-20261006-A02.
#
# Per-project overrides go in the project's pnpm-workspace.yaml.
# ------------------------------------------------------------------------------

# Refuse to install packages younger than N minutes. 4320 = 3 days.
# Widens the detection window for publish-and-grab supply-chain attacks
# (Mini Shai-Hulud being the prompt). Emergency bypass per-package via
# `minimumReleaseAgeExclude` in pnpm-workspace.yaml. `pnpm audit --fix`
# auto-adds patched versions to that exclude list.
# pnpm 11 default: 1440 (1 day).
minimumReleaseAge: 4320

# Do NOT let a package with missing registry `time` metadata skip the cooldown.
# The default (true) silently bypasses minimumReleaseAge for any version whose
# packument lacks a publish time -- a metadata-shaped hole straight through the
# 3-day wall. Set false: such a package is BLOCKED rather than waved through.
# Paranoid posture (prefer false positives): a package whose FETCHED (abbreviated)
# metadata genuinely lacks a publish time is BLOCKED with ERR_PNPM_MISSING_TIME.
# NOTE: minimumReleaseAgeExclude does NOT rescue this -- the missing-time check fires
# independently of the age check (VERIFIED 2026-07-22 with markdownlint-cli/repomix;
# the exclude only bypasses the AGE comparison, not the missing-time hard-fail). To
# install such a package, EITHER relax this to true (weakens the posture) OR use a
# code path that fetches the FULL packument, which carries time -- e.g. `pnpm dlx`
# succeeds where `pnpm add -g` fails on the same package.
# pnpm 11 default: true.
minimumReleaseAgeIgnoreMissingTime: false

# Never let the resolver fall back to a version younger than minimumReleaseAge
# through a loose-mode exception path (which would auto-record the exception
# into minimumReleaseAgeExclude instead of simply refusing the version).
# Verified 2026-08-19 against pnpm's source (createNpmResolutionVerifier.ts):
# this already turns on automatically the instant minimumReleaseAge is set
# (which we always do) -- pinned explicitly anyway so a future pnpm default
# change can't quietly flip it, same rationale as the pins below.
# pnpm 11 default: auto-true whenever minimumReleaseAge is explicitly set.
minimumReleaseAgeStrict: true

# NOTE: blockExoticSubdeps (block transitive deps from git / tarball sources) is
# IGNORED in this file by pnpm 12: `false` here still blocks, and a project's own
# `false` wins over a `true` here. It is on because the pnpm default is true. It is
# pinned instead by PNPM_CONFIG_BLOCK_EXOTIC_SUBDEPS=true in home/.zshrc, which
# outranks a project (measured 2026-10-06). D-20261006-A02.

# Validate the package store on each install. Catches corruption or
# tampering of cached tarballs at install time rather than at runtime.
# pnpm 11 default: false.
verifyStoreIntegrity: true

# Skip dependency resolution when pnpm-lock.yaml already matches package.json.
# It does NOT stop `pnpm install` from rewriting an outdated lockfile on a
# developer machine; this comment said it did until 2026-10-10. Measured on
# 12.10.0 with a package.json edited after the lockfile was written:
#   developer machine, true or unset: the install rewrites the lockfile, exit 0
#   CI=true, true or unset: ERR_PNPM_OUTDATED_LOCKFILE, lockfile untouched
#   CI=true, false: the install rewrites the lockfile (the control)
# So `true` is the default in both places. Since 12.8.0 an explicit `true` no
# longer lets CI update the lockfile (it did before). Pinned like the keys below,
# so a future default flip cannot change it quietly. To refuse lockfile changes
# on a developer machine, use `pnpm install --frozen-lockfile`.
# pnpm default: true.
preferFrozenLockfile: true

# Fail the install (non-zero exit) if any dependency ships unreviewed lifecycle
# build scripts (preinstall/install/postinstall) -- the #1 malware delivery
# vector (Rspack, nx, Shai-Hulud all used postinstall/preinstall). Approve
# specific packages with `pnpm approve-builds`, which writes an `allowBuilds`
# map into the project's pnpm-workspace.yaml.
# Already the pnpm 11 default (true); pinned to survive future default flips.
strictDepBuilds: true

# Never auto-run ALL dependency build scripts. Setting this true reverts to the
# dangerous pre-v10 behavior and disables the build-approval system entirely
# (the "dangerously" in the name is the warning).
# Already the pnpm 11 default (false); pinned defensively.
dangerouslyAllowAllBuilds: false

# Fail the install if a package's trust evidence has WEAKENED versus an earlier
# version, ordered by publish date: trusted-publisher > provenance > nothing.
# This is the only consumer-side install-time signal of weakening publish
# authentication -- e.g. a package normally shipped from CI suddenly pushed from
# a stolen-token laptop with no provenance (the nx / s1ngularity attack class).
# minimumReleaseAge cannot catch that (a malicious version can age out); this can.
# Aborts with ERR_PNPM_TRUST_DOWNGRADE.
# Paranoid posture: enabled with NO trustPolicyIgnoreAfter and NO pre-emptive
# excludes -- false positives are PREFERRED here. Add a specific `name@version`
# to `trustPolicyExclude` ONLY after manually verifying a flagged version is clean.
# pnpm default: off. Added v10.21.0; sharpened in-window by 11.4.0 (provenance
# required before trusted-publisher) and 11.5.0 (staged-publish `approver` ranked top).
trustPolicy: no-downgrade

# NOTE: `strictStorePkgContentCheck` (verify the NAMES/VERSIONS of store packages,
# complementing verifyStoreIntegrity's file-content check) CANNOT be set in this
# global config.yaml -- pnpm warns "cannot be set in the global config file ... were
# ignored" and drops it (verified 2026-06-18, pnpm 11.7.0). It is already the pnpm 11
# default (true), so the check still runs; to PIN it explicitly, set it per-project in
# pnpm-workspace.yaml or via pnpm config dependencies. Left unset here to avoid a
# WARN on every pnpm command.

# Before running any package script (pnpm run / pnpm exec / lifecycle), confirm
# node_modules matches the lockfile. The default `install` SILENTLY auto-installs
# to reconcile drift; `error` instead REFUSES and exits, so a drifted or tampered
# node_modules can never run scripts without an explicit, visible `pnpm install`.
# Paranoid posture: fail closed rather than auto-mutate. Trade-off: a `pnpm run`
# errors when deps are out of sync (run `pnpm install` first). Relax per-project
# with `verifyDepsBeforeRun: install` in that project's pnpm-workspace.yaml.
# pnpm 11 default: install.
verifyDepsBeforeRun: error

# When a project pins another package manager or pnpm version (packageManager or
# devEngines.packageManager), run THIS machine's pnpm and print one warning line,
# instead of downloading and running the pinned version. Unset, a project pinned
# to pnpm@11.1.2 ran 11.1.2: 17 advisories, six of these keys ignored, and none of
# pnpm_update's cooldown, deny list or floor. Read from this file on 12.9.0
# (measured 2026-10-06; the old note here saying pnpm rejects it globally was
# pnpm 11). Do NOT also export PNPM_CONFIG_PM_ON_FAIL: an env value outranks a
# project's own pmOnFail. Gavin's pick 2026-10-06, D-20261006-A02.
# pnpm default: download.
pmOnFail: warn

# NOTE: pnpm 11.3+ offers `trustLockfile: true` to skip supply-chain
# verification of lockfile entries. Intentionally NOT set -- the default
# (false) keeps minimumReleaseAge + trustPolicy lockfile validation active.

# pnpm 12: keep the `node` command with nvm. pnpm 12 added globalShims, default
# { node: true, deno: true, bun: true }: inside a project that pins a runtime
# (devEngines.runtime / engines.runtime), typing `node` runs pnpm's own downloaded
# Node instead of the shell's. This box runs nvm, and the two would compete for the
# same command name. Set explicitly to false so nvm always answers; a project that
# really wants pnpm-managed Node can opt in per-project. Bypass one invocation with
# PNPM_SHIM_BYPASS=1. Gavin took pnpm 12 (12.4.1) by hand on 2026-09-19 via
# pnpm_update; this was the one prerequisite still open (D-20260919-06).
globalShims: false

# NOTE: supportedArchitectures, python.enabled and cargo.enabled were pinned here
# on 2026-09-20 (D-20260919-A08) and REMOVED 2026-10-06: pnpm 12 ignores all three
# in this file (a global os:[linux] still installed darwin-arm64; the original arm
# was a project pin). Their defaults are what we wanted anyway (current; false;
# false). Pin them per project in pnpm-workspace.yaml if one ever needs it.
# D-20261006-A02.

# pnpm 12.4: when install / add / update / remove / dedupe rewrites the lockfile,
# drop `trustPolicyExclude` entries (name@version) the new lockfile no longer
# contains; `@scope/*` patterns are kept. A hand-approved trust exception must
# not outlive the version it was approved for. Effect on an existing project:
# only its pnpm-workspace.yaml exclude list can shrink, and only after a lockfile
# rewrite; the cleanup is skipped when the lockfile does not cover the whole
# workspace. Reads back via `pnpm config get` (measured 2026-09-20, 12.4.1).
# Ruling D-20260919-09.
# pnpm 12 default: false.
trustPolicyExcludePrune: true

# pnpm 12.0: `pnpm audit --fix` also removes `audit.ignore` entries for GHSA
# advisories that no longer appear in the report, so the tolerated list cannot
# accumulate dead entries. Touches nothing on `pnpm install`; only `audit --fix`.
# Reads back (12.4.1). Ruling D-20260919-09.
# pnpm 12 default: false.
audit:
  ignorePrune: true

# pnpm 12.0 split sideEffectsCache into read / write / remote. read + write keep
# the LOCAL build-output cache (the default, unchanged). `remote` is the pnpr
# server object (org, packages) that restores signed build artifacts produced on
# another machine; null means no build output ever comes from off this box.
# `remote: false` is REJECTED by the 12.4.1 parser ("did not match any variant of
# untagged enum SideEffectsCacheSetting"); `remote: null` is accepted and reads
# back as {read: true, write: true, remote: null}. Measured 2026-09-20.
# Effect on an existing project: none. Ruling D-20260919-09.
# pnpm 12 default: read true, write true, remote unset.
sideEffectsCache:
  read: true
  write: true
  remote: null

# Refuse to install any dependency whose `engines` field excludes the running
# Node; off, pnpm only warns. 12.0 tightened the rule: a package reached through
# a regular dependency edge fails the install even when it also sits under an
# optionalDependencies edge; only packages reachable solely by optional edges
# are still skipped. EFFECT ON AN EXISTING PROJECT: `pnpm install` can now FAIL
# with ERR_PNPM_UNSUPPORTED_ENGINE where it used to warn, typically after
# `nvm install --lts` moves Node past a dependency's upper bound. Fix the Node
# version, or set `engineStrict: false` in that project's pnpm-workspace.yaml.
# Behaviour arm (12.4.1, 2026-09-20): a file: dep with engines.node "<1"
# installed with this unset and failed ERR_PNPM_UNSUPPORTED_ENGINE with it set.
# On 12.4.1 `--config.engineStrict=true` on the command line did nothing; since
# 12.8.0 it works (re-measured on 12.10.0, 2026-10-10: this key, `--engine-strict`
# and `--config.engineStrict=true` all fail the same probe, unset installs).
# Reads back. Ruling D-20260919-09.
# pnpm 12 default: false.
engineStrict: true

# Do not print pnpm's own "Update available! X -> Y" notice. It compares against
# the registry `latest` and ignores minimumReleaseAge, so it names versions still
# inside the 3-day wait (12.9.1 on 2026-10-06) and points at a bare self-update
# that skips pnpm_update's deny list and binary checks. The welcome banner reports
# updates with the cooldown applied. D-20261006-A02.
# pnpm default: true.
updateNotifier: false
